name = "sinemart-talent"
account_id = "67f961331110b81774851ee4f54349b9"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "public"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "sinemart-talent"
database_id = "aaf71364-974f-4ce8-a59a-c4122b30d26c"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "sinemart-talent"

# ADMIN_TOKEN (guards /api/export.csv) is a secret:
#   wrangler secret put ADMIN_TOKEN

# Retraining fits every model (Model 1 plus the comparison models) on all
# picks, which takes seconds of CPU. Allow up to 5 minutes (paid plan).
[limits]
cpu_ms = 300000

# Retrain runs here (every minute, only when 10+ new picks are in), not after
# each pick: a cron run may take minutes, a request's leftover time can't.
[triggers]
crons = ["* * * * *"]
