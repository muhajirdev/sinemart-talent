<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202020">
<link rel="manifest" href="/manifest.webmanifest">
<title>Sinemart · Pilih</title>
<style>
  :root { --bg: #202020; --fg: #f2f2f2; --muted: #9a9a9a; --accent: #f5c242; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 8px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header span { color: var(--muted); font-size: 14px; }
  header a { color: var(--accent); font-size: 14px; text-decoration: none; white-space: nowrap; }
  #pair { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
  @media (max-aspect-ratio: 3/4) { #pair { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 10px; } }
  .card { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  /* The photo is for looking only: tapping it never picks. */
  .photo { position: relative; flex: 1; min-height: 0; border-radius: 12px; overflow: hidden; background: #808080;
    touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .photo img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .photo .label { position: absolute; top: 8px; left: 8px; background: #000a; color: #fff; border-radius: 999px;
    padding: 4px 10px; font: 600 12px system-ui; }
  .photo .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%;
    border: 0; background: #000a; color: #fff; font-size: 22px; line-height: 40px; padding: 0; cursor: pointer; }
  .photo .nav.prev { left: 8px; } .photo .nav.next { right: 8px; }
  .photo .dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; gap: 6px; justify-content: center; pointer-events: none; }
  .photo .dots i { width: 7px; height: 7px; border-radius: 50%; background: #fff6; box-shadow: 0 0 2px #0008; }
  .photo .dots i.on { background: #fff; }
  .pick { border: 0; border-radius: 12px; padding: 12px; font-size: 16px; font-weight: 700; background: var(--accent); color: #111; cursor: pointer; }
  .pick kbd { font: 600 12px system-ui; opacity: .6; margin-left: 6px; }
  .pick:disabled { opacity: .45; }
  .card.chosen .photo { outline: 4px solid var(--accent); outline-offset: -4px; }
  #toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #f2f2f2; color: #111; border-radius: 999px; padding: 10px 8px 10px 18px; font-size: 15px;
    display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 16px #0008; white-space: nowrap; }
  #toast button { border: 0; background: #111; color: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .keys { color: var(--muted); font-size: 12px; text-align: center; }
  @media (hover: none) { .pick kbd, .keys { display: none; } }
  footer { display: flex; gap: 12px; justify-content: center; padding: 12px 0; }
  footer button { background: #333; color: var(--fg); border: 0; border-radius: 999px; padding: 10px 20px; font-size: 15px; }
  footer button:disabled { opacity: .4; }
  #msg { text-align: center; color: var(--muted); padding: 40px 0; }
  .hide { display: none !important; }
  #login { max-width: 340px; margin: 40px auto; display: flex; flex-direction: column; gap: 12px; }
  #login p { color: var(--muted); margin: 0; font-size: 14px; }
  #login input { background: #333; color: var(--fg); border: 1px solid #555; border-radius: 10px; padding: 12px; font-size: 16px; }
  #login button { background: var(--accent); color: #111; border: 0; border-radius: 999px; padding: 12px; font-size: 16px; font-weight: 600; }
  #loginErr { color: #ff8a80; font-size: 14px; min-height: 1em; }
  #who { color: var(--muted); font-size: 14px; }
  #who button { all: unset; color: var(--accent); cursor: pointer; margin-left: 6px; }
</style>
</head>
<body>
<header>
  <h1>Mana yang lebih menarik?</h1>
  <a id="count" href="/results.html"></a>
</header>
<div id="who" class="hide"></div>
<form id="login" class="hide">
  <p>Tulis nama kamu dulu. Semua pilihanmu dicatat dengan nama ini.</p>
  <input id="name" autocomplete="name" placeholder="Nama" maxlength="40" required>
  <button type="submit">Mulai</button>
  <div id="loginErr"></div>
</form>
<div id="msg" class="hide"></div>
<main id="pair" class="hide">
  <section class="card" id="left">
    <div class="photo"><img alt="Peserta kiri"><span class="label"></span>
      <button class="nav prev" aria-label="Foto sebelumnya">‹</button><button class="nav next" aria-label="Foto berikutnya">›</button>
      <span class="dots"></span></div>
    <button class="pick" data-side="left">Pilih yang ini<kbd>1</kbd></button>
  </section>
  <section class="card" id="right">
    <div class="photo"><img alt="Peserta kanan"><span class="label"></span>
      <button class="nav prev" aria-label="Foto sebelumnya">‹</button><button class="nav next" aria-label="Foto berikutnya">›</button>
      <span class="dots"></span></div>
    <button class="pick" data-side="right">Pilih yang ini<kbd>2</kbd></button>
  </section>
</main>
<footer id="bar" class="hide">
  <button id="undo" disabled>↶ Batalkan</button>
  <button id="skip">Lewati</button>
</footer>
<div class="keys hide" id="keys">← → ganti foto · 1 / 2 pilih · S lewati · U batalkan</div>
<div id="toast" class="hide" role="status"><span id="toastText"></span><button id="toastUndo">Batalkan</button></div>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} };
  const load = (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } };
  let token = qs.get("t") || load("rater");
  if (qs.get("t")) store("rater", token);
  if (qs.has("t") || qs.has("team")) history.replaceState(null, "", "/");
  const $ = (id) => document.getElementById(id);
  const show = (text) => { $("msg").textContent = text; $("msg").classList.remove("hide");
    $("pair").classList.add("hide"); $("bar").classList.add("hide"); };

  // Name-only sign-in, open to anyone.
  function signIn(err) {
    $("login").classList.remove("hide");
    ["msg", "pair", "bar", "who"].forEach((id) => $(id).classList.add("hide"));
    $("loginErr").textContent = err || "";
    $("name").focus();
  }
  $("login").onsubmit = async (e) => {
    e.preventDefault();
    const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ name: $("name").value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return signIn(r.status === 400 ? "Tulis nama kamu (minimal 2 huruf)." : "Gagal masuk, coba lagi.");
    store("rater", (token = d.token));
    $("login").classList.add("hide");
    start();
  };

  const api = (path, opts = {}) =>
    fetch(path, { ...opts, headers: { "x-rater-token": token, "content-type": "application/json" } });
  const imgUrl = (id, n) => `/img/${id}${n == null ? "" : "/" + n}?t=${encodeURIComponent(token)}`;

  // One person can have several photos. View 0 is the face crop the model
  // scores; views 1.. are their whole photos (closeup, full-body 1, 2, ...).
  // Looking (arrows, dots, swipe, tap on the photo) is kept apart from
  // choosing (the "Pilih" button), so browsing never picks by accident.
  const views = { left: 0, right: 0 };
  const label = (kinds, v) => v === 0 ? "Wajah" : kinds[v - 1] === "closeup" ? "Close-up"
    : kinds[v - 1].startsWith("fullbody") ? "Seluruh badan " + kinds[v - 1].slice(8) : "Foto lain";
  function showView(side) {
    const id = current[side + "_id"], kinds = current[side + "_photos"] || [];
    const total = kinds.length + 1, v = views[side], box = $(side).querySelector(".photo");
    box.querySelector("img").src = v === 0 ? imgUrl(id) : imgUrl(id, v - 1);
    box.querySelector(".label").textContent = total < 2 ? "Wajah" : `${label(kinds, v)} · ${v + 1}/${total}`;
    box.querySelectorAll(".nav").forEach((n) => n.classList.toggle("hide", total < 2));
    box.querySelector(".dots").innerHTML = total < 2 ? "" : Array.from({ length: total }, (_, i) => `<i class="${i === v ? "on" : ""}"></i>`).join("");
  }
  function flip(side, step) {
    if (!current) return;
    const total = (current[side + "_photos"] || []).length + 1;
    views[side] = (views[side] + step + total) % total;
    showView(side);
  }
  for (const side of ["left", "right"]) {
    const box = $(side).querySelector(".photo");
    box.querySelector(".prev").onclick = (e) => { e.stopPropagation(); flip(side, -1); };
    box.querySelector(".next").onclick = (e) => { e.stopPropagation(); flip(side, 1); };
    let x0 = null;
    box.addEventListener("pointerdown", (e) => { x0 = e.clientX; });
    box.addEventListener("pointerup", (e) => {
      if (x0 === null || e.target.closest(".nav")) return (x0 = null);
      const dx = e.clientX - x0, r = box.getBoundingClientRect();
      if (Math.abs(dx) > 40) flip(side, dx < 0 ? 1 : -1); // swipe
      else flip(side, e.clientX < r.left + r.width / 3 ? -1 : 1); // tap: left third back, else forward
      x0 = null;
    });
  }

  let current = null, next = null, shownAt = 0, busy = false, picks = 0;

  async function fetchPair() {
    const r = await api("/api/pair");
    if (r.status === 401) { store("rater", null); token = null; signIn(); throw new Error(""); }
    if (!r.ok) throw new Error("Belum ada foto peserta.");
    const p = await r.json();
    // Preload both images before the pair is shown.
    await Promise.all([p.left_id, p.right_id].map((id) => new Promise((ok) => {
      const im = new Image(); im.onload = im.onerror = ok; im.src = imgUrl(id);
    })));
    return p;
  }

  function render(p) {
    current = p;
    views.left = views.right = 0;
    showView("left"); showView("right");
    document.querySelectorAll(".card").forEach((b) => b.classList.remove("chosen"));
    $("msg").classList.add("hide"); $("pair").classList.remove("hide"); $("bar").classList.remove("hide");
    $("keys").classList.remove("hide");
    // A double tap must not carry over into the next pair.
    document.querySelectorAll(".pick").forEach((b) => (b.disabled = true));
    setTimeout(() => document.querySelectorAll(".pick").forEach((b) => (b.disabled = false)), 450);
    $("count").textContent = `${picks} pilihan · lihat skor →`;
    shownAt = performance.now();
    next = fetchPair().catch(() => null);
  }

  let toastTimer = null, canUndo = false;
  function toast(text) {
    $("toastText").textContent = text;
    $("toast").classList.remove("hide");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").classList.add("hide"), 5000);
  }

  async function pick(side) {
    if (busy || !current) return;
    if (side !== "skip" && performance.now() - shownAt < 450) return;
    busy = true;
    const winner = side === "left" ? current.left_id : side === "right" ? current.right_id : null;
    if (side !== "skip") $(side).classList.add("chosen");
    const body = { queue_id: current.queue_id, left_id: current.left_id, right_id: current.right_id,
      winner_id: winner, ms: performance.now() - shownAt };
    try {
      const r = await api("/api/pick", { method: "POST", body: JSON.stringify(body) });
      if (!r.ok) throw new Error();
      if (winner !== null) picks++;
      canUndo = true; $("undo").disabled = false;
      toast(side === "skip" ? "Dilewati" : "Pilihan tersimpan");
      const p = (await next) || (await fetchPair());
      render(p);
    } catch (e) {
      if (!token) return;
      show(e.message || "Koneksi terputus. Mencoba lagi…");
      setTimeout(start, 3000);
    } finally { busy = false; }
  }

  async function start() {
    try {
      const res = await api("/api/me");
      if (res.status === 401) { store("rater", null); token = null; return signIn(); }
      const me = await res.json();
      picks = me.picks || 0;
      $("who").innerHTML = "";
      $("who").append(`Halo, ${me.name}`);
      const out = document.createElement("button");
      out.textContent = "Bukan kamu?";
      out.onclick = () => { store("rater", null); token = null; current = null; signIn(); };
      $("who").append(out);
      $("who").classList.remove("hide");
      render(await fetchPair());
    } catch (e) { if (e.message) show(e.message); }
  }

  // Undo the last answer: it is deleted and the same pair comes back.
  async function undo() {
    if (busy || !canUndo) return;
    busy = true;
    try {
      const r = await api("/api/undo", { method: "POST" });
      if (!r.ok) throw new Error();
      const p = await r.json();
      if (p.was_pick) picks = Math.max(0, picks - 1);
      canUndo = false; $("undo").disabled = true;
      $("toast").classList.add("hide");
      render(p);
    } catch (_) {
      toast("Tidak bisa dibatalkan");
    } finally { busy = false; }
  }

  document.querySelectorAll(".pick").forEach((b) => (b.onclick = () => pick(b.dataset.side)));
  $("skip").onclick = () => pick("skip");
  $("undo").onclick = undo;
  $("toastUndo").onclick = undo;
  addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey) return;
    const k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "arrowright") { flip("left", k === "arrowleft" ? -1 : 1); flip("right", k === "arrowleft" ? -1 : 1); }
    else if (k === "1") pick("left");
    else if (k === "2") pick("right");
    else if (k === "s" || k === " ") { e.preventDefault(); pick("skip"); }
    else if (k === "u" || k === "backspace") { e.preventDefault(); undo(); }
  });
  token ? start() : signIn();
})();
</script>
</body>
</html>
