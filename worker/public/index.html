<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202020">
<link rel="manifest" href="/manifest.webmanifest">
<title>Sinemart Pick</title>
<style>
  :root { --bg: #202020; --fg: #f2f2f2; --muted: #9a9a9a; --accent: #f5c242; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 8px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header span { color: var(--muted); font-size: 14px; }
  header a { color: var(--accent); font-size: 14px; text-decoration: none; white-space: nowrap; }
  #pair { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
  @media (max-aspect-ratio: 3/4) { #pair { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  button.face { all: unset; touch-action: pan-y; cursor: pointer; position: relative; border-radius: 12px; overflow: hidden;
    background: #808080; display: flex; align-items: center; justify-content: center; min-height: 0; }
  button.face img { width: 100%; height: 100%; object-fit: contain; display: block; }
  button.face:focus-visible { outline: 3px solid var(--accent); }
  button.face.chosen { outline: 4px solid var(--accent); }
  button.face kbd { position: absolute; left: 8px; bottom: 8px; background: #0008; color: #fff;
    padding: 2px 8px; border-radius: 6px; font: 13px system-ui; }
  button.face .more { position: absolute; top: 8px; right: 8px; background: #000a; color: #fff; border: 0;
    border-radius: 999px; padding: 6px 12px; font: 600 13px system-ui; cursor: pointer; }
  button.face .dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; gap: 5px; justify-content: center; pointer-events: none; }
  button.face .dots i { width: 6px; height: 6px; border-radius: 50%; background: #fff6; }
  button.face .dots i.on { background: #fff; }
  footer { display: flex; gap: 12px; justify-content: center; padding: 12px 0; }
  footer button { background: #333; color: var(--fg); border: 0; border-radius: 999px; padding: 10px 20px; font-size: 15px; }
  #msg { text-align: center; color: var(--muted); padding: 40px 0; }
  .hide { display: none !important; }
  #login { max-width: 340px; margin: 40px auto; display: flex; flex-direction: column; gap: 12px; }
  #login p { color: var(--muted); margin: 0; font-size: 14px; }
  #login input { background: #333; color: var(--fg); border: 1px solid #555; border-radius: 10px; padding: 12px; font-size: 16px; }
  #login button { background: var(--accent); color: #111; border: 0; border-radius: 999px; padding: 12px; font-size: 16px; font-weight: 600; }
  #loginErr { color: #ff8a80; font-size: 14px; min-height: 1em; }
  #who { color: var(--muted); font-size: 14px; }
  #who button { all: unset; color: var(--accent); cursor: pointer; margin-left: 6px; }
  @media (hover: none) { button.face kbd { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Siapa lebih layar? <span>Who's more screen-worthy?</span></h1>
  <a id="count" href="/results.html"></a>
</header>
<div id="who" class="hide"></div>
<form id="login" class="hide">
  <p>Ketik nama Anda. Setiap pilihan dicatat atas nama ini.<br>Type your name. Every pick is saved under it.</p>
  <input id="name" autocomplete="name" placeholder="Nama / Name" maxlength="40" required>
  <input id="code" placeholder="Kode tim / Team code" autocomplete="off">
  <button type="submit">Mulai · Start</button>
  <div id="loginErr"></div>
</form>
<div id="msg" class="hide"></div>
<main id="pair" class="hide">
  <button class="face" id="left" aria-label="Pick left"><img alt=""><kbd>←</kbd>
    <span class="more hide" role="button" aria-label="Next photo of this person"></span><span class="dots"></span></button>
  <button class="face" id="right" aria-label="Pick right"><img alt=""><kbd>→</kbd>
    <span class="more hide" role="button" aria-label="Next photo of this person"></span><span class="dots"></span></button>
</main>
<footer id="bar" class="hide">
  <button id="skip">Tidak bisa pilih / skip</button>
</footer>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} };
  const load = (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } };
  let token = qs.get("t") || load("rater");
  if (qs.get("team")) store("team", qs.get("team"));
  if (qs.get("t")) store("rater", token);
  if (qs.has("t") || qs.has("team")) history.replaceState(null, "", "/");
  const $ = (id) => document.getElementById(id);
  const show = (text) => { $("msg").textContent = text; $("msg").classList.remove("hide");
    $("pair").classList.add("hide"); $("bar").classList.add("hide"); };

  // Name-only sign-in behind the team code (from the team link).
  function signIn(err) {
    $("login").classList.remove("hide");
    ["msg", "pair", "bar", "who"].forEach((id) => $(id).classList.add("hide"));
    $("code").value = load("team") || "";
    $("code").classList.toggle("hide", !!load("team") && !err);
    $("loginErr").textContent = err || "";
    $("name").focus();
  }
  $("login").onsubmit = async (e) => {
    e.preventDefault();
    const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ name: $("name").value, code: $("code").value.trim() }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return signIn(r.status === 403 ? "Kode tim salah. Wrong team code." : d.error || "Coba lagi. Try again.");
    store("team", $("code").value.trim());
    store("rater", (token = d.token));
    $("login").classList.add("hide");
    start();
  };

  const api = (path, opts = {}) =>
    fetch(path, { ...opts, headers: { "x-rater-token": token, "content-type": "application/json" } });
  const imgUrl = (id, n) => `/img/${id}${n == null ? "" : "/" + n}?t=${encodeURIComponent(token)}`;

  // One person can have several photos. View 0 is the face crop the model
  // scores; views 1.. are their whole photos (closeup, full-body 1, 2, ...).
  // Swipe sideways on a face, or tap the photo counter, to flip through.
  const views = { left: 0, right: 0 };
  function showView(side) {
    const id = current[side + "_id"], kinds = current[side + "_photos"] || [];
    const total = kinds.length + 1, v = views[side];
    const b = $(side);
    b.querySelector("img").src = v === 0 ? imgUrl(id) : imgUrl(id, v - 1);
    const more = b.querySelector(".more");
    more.classList.toggle("hide", total < 2);
    more.textContent = `${v === 0 ? "wajah · face" : kinds[v - 1].replace("fullbody", "full body ")} · ${v + 1}/${total} ›`;
    b.querySelector(".dots").innerHTML = total < 2 ? "" : Array.from({ length: total }, (_, i) => `<i class="${i === v ? "on" : ""}"></i>`).join("");
  }
  function flip(side, step) {
    if (!current) return;
    const total = (current[side + "_photos"] || []).length + 1;
    views[side] = (views[side] + step + total) % total;
    showView(side);
  }
  let swiped = false;
  for (const side of ["left", "right"]) {
    const b = $(side);
    b.querySelector(".more").addEventListener("click", (e) => { e.stopPropagation(); flip(side, 1); });
    let x0 = null;
    b.addEventListener("pointerdown", (e) => { x0 = e.clientX; swiped = false; });
    b.addEventListener("pointerup", (e) => {
      if (x0 !== null && Math.abs(e.clientX - x0) > 40) { swiped = true; flip(side, e.clientX < x0 ? 1 : -1); }
      x0 = null;
    });
  }

  let current = null, next = null, shownAt = 0, busy = false, picks = 0;

  async function fetchPair() {
    const r = await api("/api/pair");
    if (r.status === 401) { store("rater", null); token = null; signIn(); throw new Error(""); }
    if (!r.ok) throw new Error("Belum ada foto. No applicants loaded yet.");
    const p = await r.json();
    // Preload both images before the pair is shown.
    await Promise.all([p.left_id, p.right_id].map((id) => new Promise((ok) => {
      const im = new Image(); im.onload = im.onerror = ok; im.src = imgUrl(id);
    })));
    return p;
  }

  function render(p) {
    current = p;
    views.left = views.right = 0;
    showView("left"); showView("right");
    document.querySelectorAll(".face").forEach((b) => b.classList.remove("chosen"));
    $("msg").classList.add("hide"); $("pair").classList.remove("hide"); $("bar").classList.remove("hide");
    $("count").textContent = `${picks} pilihan · skor →`;
    shownAt = performance.now();
    next = fetchPair().catch(() => null);
  }

  async function pick(side) {
    if (busy || !current) return;
    busy = true;
    const winner = side === "left" ? current.left_id : side === "right" ? current.right_id : null;
    if (side !== "skip") $(side).classList.add("chosen");
    const body = { queue_id: current.queue_id, left_id: current.left_id, right_id: current.right_id,
      winner_id: winner, ms: performance.now() - shownAt };
    try {
      const r = await api("/api/pick", { method: "POST", body: JSON.stringify(body) });
      if (!r.ok) throw new Error();
      if (winner !== null) picks++;
      const p = (await next) || (await fetchPair());
      render(p);
    } catch (e) {
      if (!token) return;
      show(e.message || "Koneksi gagal, coba lagi. Connection failed, try again.");
      setTimeout(start, 3000);
    } finally { busy = false; }
  }

  async function start() {
    try {
      const res = await api("/api/me");
      if (res.status === 401) { store("rater", null); token = null; return signIn(); }
      const me = await res.json();
      picks = me.picks || 0;
      $("who").innerHTML = "";
      $("who").append(`Halo, ${me.name}`);
      const out = document.createElement("button");
      out.textContent = "bukan saya · not me";
      out.onclick = () => { store("rater", null); token = null; current = null; signIn(); };
      $("who").append(out);
      $("who").classList.remove("hide");
      render(await fetchPair());
    } catch (e) { if (e.message) show(e.message); }
  }

  $("left").onclick = () => { if (!swiped) pick("left"); swiped = false; };
  $("right").onclick = () => { if (!swiped) pick("right"); swiped = false; };
  $("skip").onclick = () => pick("skip");
  addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowLeft" || e.key === "1") pick("left");
    else if (e.key === "ArrowRight" || e.key === "2") pick("right");
    else if (e.key === " " || e.key === "ArrowDown") { e.preventDefault(); pick("skip"); }
  });
  token ? start() : signIn();
})();
</script>
</body>
</html>
